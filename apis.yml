aid: parallax
name: Parallax
description: >-
  Parallax is a stablecoin-powered cross-border and B2B payments platform founded by
  Mika Reyes (CEO) and Alex Kuang (CTO) to remove the friction, delays, and opaque fees
  from international money movement across the roughly $21 trillion cross-border payments
  market. Serving freelancers, remote workers, and businesses in 150+ countries, Parallax
  let recipients get paid near-instantly in USDC, hold balances in a self-custodied wallet,
  and withdraw to local currency, while its first B2B product streamlined web3 companies'
  payables and receivables from vendor onboarding and approvals through payout and
  accounting. The company raised a $4.5M seed round backed by General Catalyst, Dragonfly,
  Circle, and gumi Cryptos Capital. Parallax was acquired by crypto wallet company Phantom,
  and the standalone Parallax app wound down on September 18, 2025.
